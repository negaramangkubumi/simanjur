<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMANJUR</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1WtBaDNL9LTKjIH1iHVz5WcQ9fDMHDpCu">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* LOADING SCREEN */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #fff; display: flex; justify-content: center;
      align-items: center; z-index: 999999;
      transition: opacity 0.4s;
    }

    .loader-container {
      text-align: center;
      font-family: sans-serif;
      width: 100%;
    }

    .app-logo {
      width: 70px; height: 70px; object-fit: contain;
      margin: 0 auto 16px; display: block;
    }

    .bouncing-ball {
      width: 45px; height: 45px; background: #4285F4; border-radius: 50%;
      margin: 0 auto 20px; animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce { to { transform: translateY(-20px); } }

    .loader-text {
      font-size: 5vw;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
      padding: 0 15px;
      line-height: 1.3;
      word-wrap: break-word;
    }

    .sub-text {
      font-size: 3.5vw;
      color: #666;
      font-style: italic;
      padding: 0 20px;
      line-height: 1.4;
    }

    @media (min-width: 768px) {
      .loader-text { font-size: 1.5rem; }
      .sub-text { font-size: 1rem; }
    }

    .fade-out { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loader-container">
      <img class="app-logo" src="https://lh3.googleusercontent.com/d/1WtBaDNL9LTKjIH1iHVz5WcQ9fDMHDpCu" alt="SIMANJUR">
      <div class="bouncing-ball"></div>
      <div class="loader-text" id="funny-text">Sabar ya, lagi nyiapin aplikasi...</div>
      <div class="sub-text" id="funny-subtext">Bentar lagi kok! 🚀</div>
    </div>
  </div>

  <iframe
    id="app-iframe"
    src="https://script.google.com/macros/s/AKfycbzc6NwxjCdKYG8PrM8CIdODyUb6kK84vq7OxnghlXsUs2bLFK3TU2yZ52BSzW0qL-zr/exec"
    allow="camera; microphone; geolocation"
    allowfullscreen
    sandbox="allow-downloads allow-forms allow-modals allow-popups allow-scripts allow-same-origin allow-popups-to-escape-sandbox"
    onload="hideLoading()">
  </iframe>

  <script>
    const jokes = [
      { t: "Lagi ngejar server...", s: "Sabar ya, hampir masuk! 🚀" },
      { t: "Sinkronisasi data...", s: "Bentar lagi kelar, tenang aja. 💾" },
      { t: "Memproses permintaan...", s: "Sat set sat set, hampir jadi! ✨" },
      { t: "Menyiapkan tampilan...", s: "Dikit lagi, jangan ke mana-mana. 👀" },
      { t: "Menghubungkan ke server...", s: "Koneksi lagi jalan, tunggu ya. 📡" }
    ];

    (function init() {
      const item = jokes[Math.floor(Math.random() * jokes.length)];
      document.getElementById('funny-text').textContent = item.t;
      document.getElementById('funny-subtext').textContent = item.s;
    })();

    function hideLoading() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => { loader.style.display = 'none'; }, 400);
      }
    }

    // Batas waktu maksimal loading (10 detik) jika koneksi sangat lambat
    setTimeout(hideLoading, 10000);
  </script>

</body>
</html>
